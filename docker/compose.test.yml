# Pile minimale « Supabase-compatible » pour les tests d'intégration et E2E :
# PostgreSQL Supabase + authentification (GoTrue) + stockage de fichiers (Storage API). Les secrets ci-dessous
# sont des valeurs de TEST uniquement, jamais utilisées ailleurs.
# Usage : npm run stack:up / npm run stack:down
name: daf-test
services:
  db:
    image: supabase/postgres:17.11.0.004
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 60
  auth:
    image: supabase/gotrue:v2.180.0
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "54329:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "1000"
      GOTRUE_RATE_LIMIT_VERIFY: "1000"
  storage:
    image: supabase/storage-api:v1.79.36
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "54328:5000"
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS10ZXN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDAwMDAsImV4cCI6MjEwNTAwMDAwMH0.CNOsU2hhht-9HgiCxReYDDdcJ3bKbRPi-IobG3dyx1Q
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS10ZXN0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDAwMDAwMCwiZXhwIjoyMTA1MDAwMDAwfQ.jQme6xjm5KFr4i9--Kxq7emWtLgq_c1QiM5Z0gQaihk
      AUTH_JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      PGRST_JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      UPLOAD_FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      STORAGE_S3_BUCKET: stub
      IMAGE_TRANSFORMATION_ENABLED: "false"
